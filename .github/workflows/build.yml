name: Flutter CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows you to trigger the build manually from the GitHub UI

jobs:
  build_android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # The ubuntu image ships tens of GB of toolchains this build never touches,
      # and `flutter build apk --release` was filling the disk before it finished
      # (the runner could not even write its own worker log). Reclaim space first.
      # Keep /usr/local/lib/android: that is the Android SDK the build needs.
      - name: Free up runner disk space
        run: |
          echo "--- before ---"; df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
                      /usr/share/swift /usr/local/share/powershell \
                      /usr/local/lib/node_modules /home/linuxbrew \
                      "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}/CodeQL"
          sudo docker image prune --all --force || true
          sudo apt-get clean
          echo "--- after ---"; df -h /

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2' # Or any stable version you prefer
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      # Signing material comes from repo secrets so the upload key never lands in
      # the tree. Without them the build falls back to the bundled ajstore key,
      # and the artifact must not be uploaded to Play.
      - name: Set up upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set - signing with the bundled ajstore key. Do not upload these artifacts to Play."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          {
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      # Play refuses a version code it has already seen, and the pubspec's +N only
      # moved when someone remembered to bump it, so every other push died at
      # the Play upload. Derive it from the run number instead. The +100 lifts it
      # past 105, the last code taken from the pubspec, since Play also refuses
      # anything lower than a code it already has.
      - name: Set Android version code
        run: echo "ANDROID_VERSION_CODE=$(( ${{ github.run_number }} + 100 ))" >> "$GITHUB_ENV"

      - name: Build APK
        run: flutter build apk --release --build-number=$ANDROID_VERSION_CODE

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK to Loadly
        env:
          LOADLY_API_KEY: ${{ secrets.LOADLY_API_KEY }}
        run: |
          if [ -z "$LOADLY_API_KEY" ]; then
            echo "::warning::LOADLY_API_KEY secret not set — skipping Loadly upload."
            exit 0
          fi
          DESC="Android build ${{ github.run_number }} — ${{ github.ref_name }}@${GITHUB_SHA:0:7}"
          RESPONSE=$(curl -sS -X POST https://api.loadly.io/apiv2/app/upload \
            -F "_api_key=$LOADLY_API_KEY" \
            -F "buildInstallType=1" \
            -F "buildUpdateDescription=$DESC" \
            -F "file=@build/app/outputs/flutter-apk/app-release.apk")
          echo "Loadly response: $RESPONSE"
          CODE=$(echo "$RESPONSE" | jq -r '.code // empty')
          if [ "$CODE" != "0" ]; then
            echo "::error::Loadly upload failed (code=$CODE): $(echo "$RESPONSE" | jq -r '.message // .')"
            exit 1
          fi
          SHORTCUT=$(echo "$RESPONSE" | jq -r '.data.buildShortcutUrl // empty')
          QRCODE=$(echo "$RESPONSE" | jq -r '.data.buildQRCodeURL // empty')
          {
            echo "### 🤖 Android uploaded to Loadly"
            [ -n "$SHORTCUT" ] && echo "- Install: https://loadly.io/$SHORTCUT"
            [ -n "$QRCODE" ] && echo "- ![QR]($QRCODE)"
          } >> "$GITHUB_STEP_SUMMARY"

      # Play only accepts app bundles for uploads; the APK above is for Loadly
      # side-loading. Built last so that if the runner runs out of disk here, the
      # APK that already reached Loadly is unaffected.
      - name: Build App Bundle (Google Play)
        run: flutter build appbundle --release --build-number=$ANDROID_VERSION_CODE

      - name: Upload Android App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: app-release.aab
          path: build/app/outputs/bundle/release/app-release.aab

      # Publishing needs both halves: a bundle signed with the real upload key,
      # and Play API credentials. Neither is needed to build, so the publish step
      # skips cleanly when either is missing. The check lives in its own step
      # because `secrets` cannot be read from a step-level `if`.
      - name: Check Play publish credentials
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$PLAY_SERVICE_ACCOUNT_JSON" ] && [ -n "${ANDROID_KEYSTORE_PATH:-}" ]; then
            echo "PLAY_PUBLISH_READY=true" >> "$GITHUB_ENV"
          else
            echo "PLAY_PUBLISH_READY=false" >> "$GITHUB_ENV"
            echo "::notice::Skipping Play upload - it needs PLAY_SERVICE_ACCOUNT_JSON and a bundle signed with the upload key."
          fi

      # Uploaded as a draft: the release appears in the console but reaches no
      # tester until someone confirms it. Change status to `completed` to have
      # every green build go straight to the internal testers instead.
      - name: Publish to Play internal testing
        if: env.PLAY_PUBLISH_READY == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.locafy.customer
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          tracks: internal
          status: draft
          releaseName: ${{ github.run_number }} - ${{ github.sha }}
          # R8 obfuscates the release build, so Play needs this to symbolicate
          # the crash reports it shows you.
          mappingFile: build/app/outputs/mapping/release/mapping.txt
          # Committing an API edit otherwise sends every change waiting in the
          # console (listing, declarations, other tracks) to review with it,
          # which put a withdrawn open testing release back into review.
          # Submitting stays a deliberate click in Publishing overview.
          changesNotSentForReview: true

  # iOS ships as its own App Store listing, "Locafy" (app.locafy.customer,
  # Apple ID 6811112359), signed with the locafy_customer_appstore profile.
  # App Store-signed builds can't be side-loaded, so testers get them from
  # TestFlight rather than Loadly.
  build_ios:
    name: Build iOS IPA and upload to TestFlight
    runs-on: macos-latest
    env:
      # The "Locafy" team key in App Store Connect > Users and Access > Integrations.
      # Identifiers, not secrets; the .p8 itself comes from APPSTORE_API_PRIVATE_KEY.
      APPSTORE_API_KEY_ID: 3Q2ALL4684
      APPSTORE_API_ISSUER_ID: 3cdd5691-e172-44c5-b932-4cec6f4773f6
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Same shape as the Play check above: without signing material the job
      # still proves the app compiles, it just can't produce an uploadable IPA.
      - name: Check iOS signing credentials
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_APPSTORE_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          if [ -n "$IOS_DIST_CERT_P12_BASE64" ] && [ -n "$IOS_APPSTORE_PROFILE_BASE64" ]; then
            echo "IOS_SIGNING_READY=true" >> "$GITHUB_ENV"
          else
            echo "IOS_SIGNING_READY=false" >> "$GITHUB_ENV"
            echo "::warning::IOS_DIST_CERT_P12_BASE64 / IOS_APPSTORE_PROFILE_BASE64 not set - building unsigned, nothing will be uploaded."
          fi
          if [ -n "$APPSTORE_API_PRIVATE_KEY" ]; then
            echo "TESTFLIGHT_READY=true" >> "$GITHUB_ENV"
          else
            echo "TESTFLIGHT_READY=false" >> "$GITHUB_ENV"
            echo "::notice::APPSTORE_API_PRIVATE_KEY not set - skipping the TestFlight upload."
          fi

      - name: Install Apple certificate and provisioning profile
        if: env.IOS_SIGNING_READY == 'true'
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_P12_PASSWORD }}
          IOS_APPSTORE_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/dist.p12
          PP_PATH=$RUNNER_TEMP/appstore.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          # Throwaway keychain, so its password only needs to live for this job.
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          # A secret saved from a Windows file can carry a CR/LF that isn't part
          # of the password, and security then reports it as wrong.
          P12_PASSWORD=$(printf '%s' "$IOS_DIST_CERT_P12_PASSWORD" | tr -d '\r\n')

          printf '%s' "$IOS_DIST_CERT_P12_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          printf '%s' "$IOS_APPSTORE_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          # Xcode 16+ reads profiles from UserData; older Xcodes from MobileDevice.
          UUID=$(security cms -D -i "$PP_PATH" | plutil -extract UUID raw -)
          for DIR in "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" \
                     "$HOME/Library/MobileDevice/Provisioning Profiles"; do
            mkdir -p "$DIR"
            cp "$PP_PATH" "$DIR/$UUID.mobileprovision"
          done

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: 'stable'

      - name: Disable Swift Package Manager (experimental — use CocoaPods)
        run: flutter config --no-enable-swift-package-manager

      - name: Install Dependencies
        run: flutter pub get

      # App Store Connect rejects a second upload with the same build number, so
      # iOS takes the run number instead of the pubspec's +N (which Play owns).
      - name: Build IPA
        if: env.IOS_SIGNING_READY == 'true'
        run: |
          flutter build ipa --release \
            --build-number=${{ github.run_number }} \
            --export-options-plist=ios/ExportOptions.plist
          mv build/ios/ipa/*.ipa build/ios/ipa/locafy-customer.ipa

      - name: Build iOS (unsigned, compile check only)
        if: env.IOS_SIGNING_READY != 'true'
        run: flutter build ios --release --no-codesign

      - name: Upload IPA Artifact
        if: env.IOS_SIGNING_READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: locafy-customer.ipa
          path: build/ios/ipa/locafy-customer.ipa

      - name: Upload to TestFlight
        if: env.IOS_SIGNING_READY == 'true' && env.TESTFLIGHT_READY == 'true'
        env:
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          # altool looks the key up by id in this directory.
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "$APPSTORE_API_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8
          xcrun altool --upload-app --type ios \
            --file build/ios/ipa/locafy-customer.ipa \
            --apiKey "$APPSTORE_API_KEY_ID" \
            --apiIssuer "$APPSTORE_API_ISSUER_ID"
          {
            echo "### 📱 iOS build ${{ github.run_number }} uploaded to App Store Connect"
            echo "- It appears in TestFlight once Apple finishes processing (usually 5-30 min):"
            echo "  https://appstoreconnect.apple.com/apps/6811112359/testflight/ios"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up signing material
        if: ${{ always() }}
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null || true
          rm -rf ~/.appstoreconnect/private_keys
